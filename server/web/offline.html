<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E24">
<title>Wohinfahrma – offline</title>
<style>
  html, body { margin: 0; background: #0F1E24; color: #E8EEF0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .seite { max-width: 520px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 20px 32px; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: #9DB0B7; margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; color: #0B1A1F; background: #4FD1A5; border: 0; border-radius: 999px; padding: 12px 22px; min-height: 44px; }
  .zeile { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  a { color: #4FD1A5; }
  .status { font-size: 14px; margin-top: 22px; }
</style>
</head>
<body>
<main class="seite">
  <h1>Kein Netz</h1>
  <p>Die Rangliste braucht eine Verbindung, damit sie aktuell ist. Sobald du wieder Empfang hast, geht es von selbst weiter.</p>
  <div class="zeile">
    <button type="button" id="neu">Neu laden</button>
    <a href="./">Zur Rangliste</a>
  </div>
  <p class="status" id="status" aria-live="polite">Warte auf Empfang …</p>
</main>
<script>
// Prueft alle paar Sekunden (und sobald das Handy wieder "online" meldet), ob
// der Server erreichbar ist, und laedt dann die eigentliche Seite frisch.
// Statt location.reload() eine neue Navigation ohne #Anker (wie stegen-wind).
(function () {
  var status = document.getElementById('status');
  var unterwegs = false, fertig = false;

  function ziel() {
    var url = location.href.split('#')[0];
    return /\/offline\.html(\?|$)/.test(url) ? './' : url;
  }

  function weiter() {
    if (fertig) return;
    fertig = true;
    status.textContent = 'Lade …';
    location.replace(ziel());
    setTimeout(function () { fertig = false; status.textContent = 'Warte auf Empfang …'; }, 8000);
  }

  function pruefen() {
    if (unterwegs || fertig || document.visibilityState === 'hidden') return;
    unterwegs = true;
    var ctrl = 'AbortController' in window ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
    fetch('offline.html?p=' + Date.now(), { method: 'HEAD', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (r.ok) weiter(); })
      .catch(function () {})
      .then(function () { clearTimeout(t); unterwegs = false; });
  }

  document.getElementById('neu').addEventListener('click', weiter);
  addEventListener('online', pruefen);
  document.addEventListener('visibilitychange', pruefen);
  setInterval(pruefen, 5000);
  setTimeout(pruefen, 1500);
})();
</script>
</body>
</html>
