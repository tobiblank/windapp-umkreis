name: Sammeln

# Ruft zweimal am Tag die Vorhersage fuer alle Regionen bei Open-Meteo ab und
# laedt die Rohdaten per FTPS in den Datenordner auf dem Webspace.
# Seit 8.11.2026 zusaetzlich die Wassertemperatur der Seen bei Alplakes (Eawag,
# Quelle seewasser, ein Abruf je See mit Katalogfeld alplakes).
# Seit 8.11.2026 auch der Schnee-Modus (daten/schneeregionen.json): Vorhersage auf
# Tourhoehe, Ensemble und die Lageberichte der freigegebenen Warndienste. Die
# Berichte kommen meist um 17 Uhr fuer den Folgetag und gegen 8 Uhr als Update;
# deshalb ein dritter, kleiner Lauf um 7:40 UTC (8:40 Uhr im Winter) nur fuer
# lawine und schnee_vorhersage.
#
# Damit braucht die App keinen Cronjob auf Hetzner, und die Abrufe kommen von
# GitHub, nicht vom Server von ammerseewind.de (eigenes Open-Meteo-Kontingent).
#
# Zeiten in UTC: 5:25 und 17:25 = 6:25 und 18:25 Uhr im Winter, eine Stunde
# spaeter im Sommer. Geplante Actions starten oft einige Minuten verspaetet.
#
#   ausgabe/<quelle>/<lauf>.ndjson.gz  ->  <HOME_DIR>/umkreisdaten/<quelle>/<lauf>.ndjson.gz
#
# Benoetigt unter Settings > Secrets and variables > Actions:
#   Secrets:   FTP_HOST, FTP_USER, FTP_PASSWORD (dieselben wie bei stegen-wind)
#   Variables: HOME_DIR (optional; Ordner, in dem umkreisdaten/ liegt, relativ
#              zum FTP-Startordner; leer = Startordner)
#   Optional:  Secret VORRECHNEN_SCHLUESSEL (wie in config.php), Variable SEITE_URL
#              (Standard https://wohinfahrma.de) fuer den Schritt Vorrechnen
#
# Rot heisst: mindestens ein Abruf ist fehlgeschlagen (GitHub mailt). Was geklappt
# hat, ist trotzdem hochgeladen; die App zeigt dann den letzten guten Stand.

on:
  schedule:
    - cron: "25 5,17 * * *"
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Abrufen
        id: abruf
        run: |
          set +e
          nur=""
          if [ "${{ github.event.schedule }}" = "40 7 * * *" ]; then nur="--nur lawine,schnee_vorhersage"; fi
          php server/sammler.php --action daten/regionen.json ausgabe --schnee daten/schneeregionen.json $nur --debug
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Hochladen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HOME_DIR: ${{ vars.HOME_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "::error::Secrets FTP_HOST, FTP_USER oder FTP_PASSWORD fehlen."
            exit 1
          fi
          home="${HOME_DIR%/}"; [ -n "$home" ] && home="$home/"
          n=0
          while IFS= read -r f; do
            ziel="${home}umkreisdaten/${f#ausgabe/}"
            echo "→ $f  ⇒  $ziel"
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
                 --user "${FTP_USER}:${FTP_PASSWORD}" \
                 -T "$f" "ftp://${FTP_HOST}/${ziel}"
            n=$((n + 1))
          done < <(find ausgabe -name '*.ndjson.gz' | sort)
          echo "$n Dateien hochgeladen."

      - name: Vorrechnen
        # Seit 8.11.2026: Bewertung je Sportart auf dem Server vorrechnen
        # (server/web/vorrechnen.php), damit der erste Besucher nach dem Lauf nicht
        # wartet. Nicht im kleinen Lauf um 7:40 (nur Lawine). Ohne Secret
        # VORRECHNEN_SCHLUESSEL uebersprungen; ein Fehler hier macht den Lauf nicht rot.
        if: github.event.schedule != '40 7 * * *'
        env:
          VORRECHNEN_SCHLUESSEL: ${{ secrets.VORRECHNEN_SCHLUESSEL }}
          SEITE_URL: ${{ vars.SEITE_URL }}
        run: tools/vorrechnen.sh

      - name: Ergebnis
        if: steps.abruf.outputs.rc != '0'
        run: |
          echo "::error::Mindestens ein Abruf ist fehlgeschlagen, siehe Schritt Abrufen."
          exit 1
